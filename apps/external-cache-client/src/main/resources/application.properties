quarkus.application.name=external-cache-client

# Data Grid RESP connection via OpenShift Route (TLS passthrough)
datagrid.resp.host=respcache.apps.<your-cluster-domain>
datagrid.resp.port=443
datagrid.resp.username=${DG_USERNAME:app-healthcare}
datagrid.resp.password=${DG_PASSWORD:<your-healthcare-password>}
datagrid.resp.tls=true

# Index Jedis classes for CDI
quarkus.index-dependency.jedis.group-id=redis.clients
quarkus.index-dependency.jedis.artifact-id=jedis

# HTTP server
quarkus.http.port=8080
