apiVersion: infinispan.org/v2alpha1
kind: Cache
metadata:
  name: resp-cache
  namespace: rhdg-poc
spec:
  clusterName: healthcare
  name: respCache
  template: |-
    distributedCache:
      aliases:
        - "0"
      owners: "2"
      keyPartitioner: "org.infinispan.distribution.ch.impl.RESPHashFunctionPartitioner"
      mode: "SYNC"
      statistics: "true"
      encoding:
        key:
          mediaType: "application/octet-stream"
        value:
          mediaType: "application/x-protostream"
      expiration:
        lifespan: "300000"
      memory:
        maxCount: "100000"
        whenFull: "REMOVE"
