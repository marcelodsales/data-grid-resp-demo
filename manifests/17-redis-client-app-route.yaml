apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: redis-client-app
  namespace: rhdg-poc
  labels:
    app: redis-client-app
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: redis-client-app
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
